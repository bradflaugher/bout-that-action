name: Emulator smoke test

# Boots a real API 37 emulator (KVM-accelerated on GitHub's Linux runners),
# runs the instrumented tests (app/src/androidTest), then launches the game
# and captures screenshots and logcat as artifacts.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ID: com.bradflaugher.aboutthataction.debug
      MAIN_ACTIVITY: com.bradflaugher.aboutthataction.MainActivity

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # API 37 platforms install as platforms;android-37.0 (not android-37).
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      # Compile before the emulator boots so the emulator's lifetime is spent
      # testing, not building.
      - name: Build debug and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # The runner interpolates api-level verbatim into
      # system-images;android-<api-level>;<target>;<arch> and platforms;android-<api-level>,
      # so '37.0' selects system-images;android-37.0;google_apis;x86_64.
      #
      # Each script line runs as its own `sh -c`, so a failing test is recorded
      # in a marker file instead of aborting: screenshots and logcat are still
      # captured, and the last line fails the step.
      - name: Run instrumented tests and capture screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          script: |
            mkdir -p smoke
            adb logcat -c || true
            adb shell settings put system screen_off_timeout 1800000
            adb shell wm dismiss-keyguard || true
            ./gradlew connectedDebugAndroidTest || touch smoke/tests-failed
            ./gradlew installDebug
            adb shell am start -W -n "$APP_ID/$MAIN_ACTIVITY"
            sleep 6
            adb exec-out screencap -p > smoke/smoke.png
            sleep 10
            adb exec-out screencap -p > smoke/smoke-later.png
            adb shell dumpsys activity activities > smoke/activities.txt || true
            adb logcat -d > smoke/logcat.txt
            test ! -f smoke/tests-failed

      - name: Upload screenshots and logcat
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke
          path: |
            smoke/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
